name: Documentation improvement
description: Help make setup, contribution and project status clearer.
title: 'docs: '
labels: [documentation, needs-triage]
body:
  - type: input
    id: page
    attributes:
      label: Page or command
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Include the platform and command output if a setup step failed.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
