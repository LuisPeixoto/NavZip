name: Source preview release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching Cargo.toml (source archives only)
        required: true
        default: v0.2.0-dev.1
        type: string
  workflow_run:
    workflows: [Source checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: navzip-release-${{ inputs.tag || 'v0.2.0-dev.1' }}
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'LuisPeixoto/NavZip' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    name: Publish a checked source-only preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || 'v0.2.0-dev.1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip an already published version
        id: availability
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require successful source checks on this exact commit
        if: steps.availability.outputs.create == 'true'
        run: |
          source_commit=$(git rev-parse HEAD)
          for attempt in $(seq 1 30); do
            result=$(gh api "repos/$GH_REPO/commits/$source_commit/check-runs" --jq '[.check_runs[] | select(.name == "Required checks" and .app.id == 15368 and .conclusion == "success")] | length' 2>/dev/null || printf '0')
            if test "$result" -gt 0 2>/dev/null; then
              exit 0
            fi
            echo "Waiting for successful check-run indexing on $source_commit ($attempt/30)."
            sleep 10
          done
          echo "Required checks were not confirmed; no release will be published."
          exit 1
      - if: steps.availability.outputs.create == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - if: steps.availability.outputs.create == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: steps.availability.outputs.create == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: steps.availability.outputs.create == 'true'
        run: npm run check:repo
      - if: steps.availability.outputs.create == 'true'
        run: cargo xtask prepare-release "$RELEASE_TAG"
      - name: Stage and publish the checked source preview
        if: steps.availability.outputs.create == 'true'
        run: |
          source_commit=$(git rev-parse HEAD)
          gh release create "$RELEASE_TAG" "dist/releases/$RELEASE_TAG/"* --target "$source_commit" --draft --prerelease --title "NavZip $RELEASE_TAG — source preview" --notes-file docs/releases/source-preview.md
          gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' | grep -x 4
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
