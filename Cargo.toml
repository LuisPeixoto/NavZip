[workspace]
members = ["crates/navzip-extensions", "crates/navzip-helper", "xtask"]
default-members = ["xtask"]
resolver = "2"

[workspace.package]
version = "0.2.0-dev.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

